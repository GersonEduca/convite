<style>
    .hero {
        background: url("/static/bg-top.png") center top / 100% 100% no-repeat;
        padding: clamp(1.5rem, 7vw, 3rem) clamp(1rem, 5vw, 1.5rem) clamp(1.25rem, 6vw, 2rem);
        text-align: center;
        color: white;
        flex-shrink: 0;
        background-color: #f7f0e3;
    }

    .hero h2 {
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(1.75rem, 8vw, 3.25rem);
        letter-spacing: 0.04em;
    }

    .hero h1 {
        font-family: "Great Vibes", cursive;
        font-size: clamp(2.5rem, 12vw, 4.4rem);
        color: #E6B35B;
        font-weight: normal;
        margin-top: 0.6rem;
        line-height: 1.2;
        word-break: break-word;
    }

    .line {
        margin: 1.25rem auto;
        width: clamp(110px, 35vw, 170px);
        height: 2px;
        background: #d9aa56;
    }

    .hero p {
        margin-top: 1rem;
        font-size: clamp(0.9rem, 3.2vw, 1.125rem);
        line-height: 1.6;
    }

    .date {
        margin-top: 1.75rem;
        font-size: clamp(1.05rem, 4vw, 1.375rem);
        color: #F0C16B;
        letter-spacing: 0.02em;
    }
</style>

<section class="hero">
    <h2>{{ hero_title|default:"CASAMENTO" }}</h2>

    <h1>{{ hero_name|default:"Carine & Gerson" }}</h1>

    <div class="line"></div>

    {% if hero_message %}
    <p>
        {{ hero_message }}
    </p>
    {% endif %}

    {% if hero_date %}
    <div class="date">
        {{ hero_date }}
    </div>
    {% endif %}
</section>
