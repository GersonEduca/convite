<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Casamento</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Cormorant+Garamond:wght@500;700&family=Great+Vibes&display=swap"
        rel="stylesheet">

    <style>
        /* =========================================================
           RESET
           ========================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            /* base de 1rem = 16px, escalas com clamp() a partir daqui */
            font-size: 100%;
        }

        /* =========================================================
           MOBILE FIRST: estilos base = celular (< 480px)
           Em telas pequenas o convite ocupa a tela inteira, sem
           "moldura de celular" — é a própria página.
           A partir de 480px simulamos uma moldura de telefone
           centralizada, para telas maiores (tablet/desktop).
           ========================================================= */

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: clamp(0.75rem, 2.5vw, 1.25rem);
            background: #f7f0e3;
            font-family: Poppins, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
        }

        .phone {
            width: min(100%, 560px);
            margin: 0 auto;
            background: white;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            border-radius: 24px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.14);
        }

        /* ---------------------------------------------------------
           HERO
           --------------------------------------------------------- */
        .hero {
            background: url("bg-top.png") center/cover no-repeat;
            padding: clamp(1.5rem, 7vw, 3rem) clamp(1rem, 5vw, 1.5rem) clamp(1.25rem, 6vw, 2rem);
            text-align: center;
            color: white;
            flex-shrink: 0;
        }

        .hero h2 {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(1.75rem, 8vw, 3.25rem);
            letter-spacing: 0.04em;
        }

        .hero h1 {
            font-family: "Great Vibes", cursive;
            font-size: clamp(2.5rem, 12vw, 4.4rem);
            color: #E6B35B;
            font-weight: normal;
            margin-top: 0.6rem;
            line-height: 1.2;
            word-break: break-word;
        }

        .line {
            margin: 1.25rem auto;
            width: clamp(110px, 35vw, 170px);
            height: 2px;
            background: #d9aa56;
        }

        .hero p {
            margin-top: 1rem;
            font-size: clamp(0.9rem, 3.2vw, 1.125rem);
            line-height: 1.6;
        }

        .date {
            margin-top: 1.75rem;
            font-size: clamp(1.05rem, 4vw, 1.375rem);
            color: #F0C16B;
            letter-spacing: 0.02em;
        }

        /* ---------------------------------------------------------
           CONFIRMAÇÃO
           --------------------------------------------------------- */
        .confirm {
            flex: 1 1 auto;
            padding: clamp(1.25rem, 5vw, 2rem) clamp(0.95rem, 4vw, 1.4rem) clamp(1.25rem, 5vw, 1.75rem);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .confirm h3 {
            text-align: center;
            color: #B58A43;
            font-size: clamp(1.5rem, 6vw, 2.125rem);
            font-family: "Cormorant Garamond", serif;
        }

        .confirm p {
            text-align: center;
            margin: 0.6rem 0 1.75rem;
            font-size: clamp(0.85rem, 3vw, 1rem);
            color: #444;
        }

        .guest-list-panel {
            width: min(100%, 460px);
            margin: 0 auto;
            padding: 0.5rem;
            border: 2px solid #b8892f;
            border-radius: 20px;
            background: linear-gradient(135deg, #fffdf8 0%, #f7ebd6 100%);
            box-shadow: inset 0 0 0 1px #f2d7a2, 0 8px 18px rgba(0, 0, 0, 0.08);
        }

        #guests-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: min(42vh, 320px);
            overflow-y: auto;
            padding: 0.25rem 0.25rem 0.25rem 0;
            scrollbar-width: thin;
            scrollbar-color: #b8892f #f5ebd9;
        }

        #guests-list::-webkit-scrollbar {
            width: 8px;
        }

        #guests-list::-webkit-scrollbar-track {
            background: #f5ebd9;
            border-radius: 999px;
        }

        #guests-list::-webkit-scrollbar-thumb {
            background: #b8892f;
            border-radius: 999px;
        }

        .card {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            background: white;
            padding: clamp(0.9rem, 4vw, 1.125rem);
            margin-bottom: 0.9rem;
            border-radius: 18px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .12);
        }

        .name {
            font-size: clamp(1.05rem, 4vw, 1.25rem);
            font-weight: 600;
            text-align: left;
            flex: 1;
        }

        .buttons {
            display: flex;
            flex-wrap: nowrap;
            justify-content: flex-end;
            gap: 0.625rem;
            flex: 1;
        }

        button {
            cursor: pointer;
            border: none;
            padding: 0.75rem 1.125rem;
            border-radius: 30px;
            font-size: clamp(0.85rem, 3.2vw, 0.9375rem);
            min-height: 44px;
            transition: transform .2s ease;
            white-space: nowrap;
        }

        .ok {
            background: #0C2D67;
            color: white;
            flex: 1 1 45%;
        }

        .no {
            background: white;
            border: 2px solid #D4A44D;
            color: #B17B1F;
            flex: 1 1 45%;
        }

        button:hover {
            transform: scale(1.05);
        }

        /* ---------------------------------------------------------
           RODAPÉ
           --------------------------------------------------------- */
        .footer {
            background: url("bg-top.png") center/cover no-repeat;
            padding: clamp(1.25rem, 5vw, 1.75rem) clamp(1rem, 5vw, 1.25rem);
            color: white;
            text-align: center;
            border-radius: 28px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, .22);
            width: min(100%, 360px);
            max-width: 360px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            align-self: center;
        }

        .footer h3 {
            font-family: "Great Vibes", cursive;
            font-size: clamp(1.75rem, 7vw, 2.375rem);
            color: #E5B25B;
            margin-bottom: 1.25rem;
        }

        .menu {
            display: flex;
            justify-content: space-between;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .item {
            flex: 1;
            min-width: 80px;
        }

        .item button {
            width: clamp(56px, 16vw, 70px);
            height: clamp(56px, 16vw, 70px);
            padding: 0;
            border-radius: 50%;
            background: rgba(255,255,255,.12);
            border: 2px solid #D4A44D;
            font-size: clamp(1.375rem, 6vw, 1.75rem);
            color: #E6B35B;
        }

        .item p {
            margin-top: 0.625rem;
            font-size: clamp(0.8rem, 3vw, 0.9375rem);
            color: white;
        }

        /* =========================================================
           A PARTIR DE TABLETS/DESKTOP (>= 700px):
           mantemos a leitura confortável limitando a largura do
           conteúdo, sem moldura nem fundo cinza ao redor.
           ========================================================= */
        @media (max-width: 480px) {
            body {
                padding: 0;
                align-items: stretch;
            }

            .phone {
                width: 100%;
                min-height: 100dvh;
                border-radius: 0;
            }

            .confirm {
                padding: 1rem 0.75rem 1.25rem;
            }

            .card {
                flex-wrap: wrap;
            }

            .buttons {
                width: 100%;
                justify-content: flex-end;
            }

            .footer {
                width: calc(100% - 1rem);
                margin: 0 auto 0.75rem;
            }
        }

        @media (min-width: 700px) {
            .phone {
                width: min(92vw, 560px);
                max-height: min(92dvh, 820px);
            }

            .guest-list-panel {
                width: min(100%, 460px);
            }

            .footer {
                width: min(100%, 360px);
            }
        }
    </style>

</head>

<body>

    <div class="phone">

        <section class="hero">

            <h2>CASAMENTO</h2>

            <h1>Carine &amp; Gerson</h1>

            <div class="line"></div>

            <p>
                Estamos muito felizes em compartilhar
                esse momento especial com você!
            </p>

            <div class="date">
                21 • 11 • 2026
            </div>

        </section>

        <section class="confirm">

            <h3>Confirme sua presença</h3>

            <p>Escolha sua resposta abaixo.</p>

            <div class="guest-list-panel">
                <div id="guests-list"></div>
            </div>

        </section>

        <section class="footer">

            <h3>Informações</h3>

            <div class="menu">

                <div class="item">
                    <button onclick="window.open('https://maps.google.com')" aria-label="Local">
                        📍
                    </button>
                    <p>Local</p>
                </div>

                <div class="item">
                    <button onclick="window.open('https://lista.mercadolivre.com.br')" aria-label="Presentes">
                        🎁
                    </button>
                    <p>Presentes</p>
                </div>

                <div class="item">
                    <button onclick="window.open('https://calendar.google.com')" aria-label="Data">
                        📅
                    </button>
                    <p>Data</p>
                </div>

            </div>

        </section>

    </div>

    <script>
        async function getGuests() {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve([
                        { id: 1, name: 'Nome 1' },
                        { id: 2, name: 'Nome 2' },
                        { id: 3, name: 'Nome 3' },
                        { id: 4, name: 'Nome 4' },
                        { id: 5, name: 'Nome 5' },
                        { id: 6, name: 'Nome 6' },
                        { id: 7, name: 'Nome 7' },
                        { id: 8, name: 'Nome 8' }
                    ]);
                }, 300);
            });
        }

        function renderGuests(guests) {
            const container = document.getElementById('guests-list');
            if (!container) return;

            container.innerHTML = guests.map((guest) => `
                <div class="card" data-id="${guest.id}">
                    <div class="name">${guest.name}</div>
                    <div class="buttons">
                        <button class="ok">✔ Confirmar</button>
                        <button class="no">✖ Negar</button>
                    </div>
                </div>
            `).join('');
        }

        async function initGuests() {
            const guests = await getGuests();
            renderGuests(guests);
        }

        initGuests();
    </script>

</body>

</html>
