{% extends "admin/base_site.html" %}
{% block content %}
<div id="content-main">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <fieldset class="module aligned">
            <h2>Importar convidados em XLSX</h2>
            <div>
                <p>Use uma planilha com colunas: <strong>ID</strong>, <strong>Convidados</strong>, <strong>Chefe</strong>, <strong>Telefone</strong>, <strong>Observação</strong>.</p>
                <p>Se o campo <strong>Chefe</strong> for preenchido, o convidado entra na família do chefe correspondente.</p>
            </div>
            {{ form.as_p }}
        </fieldset>
        <div class="submit-row">
            <input type="submit" value="Importar" class="default" />
        </div>
    </form>
</div>
{% endblock %}
